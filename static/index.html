<script>
"use strict";
/* ============================================================
   丧尸围城 · 双人合作横版枪战

   1P(蓝)  A/D 移动  W 跳/上瞄  S 蹲/下瞄  J 射击  K 手雷  Q 换枪
   2P(橙)  ←/→ 移动  ↑ 跳/上瞄  ↓ 蹲/下瞄  1 射击  2 手雷  3 换枪
   通用     P/Esc 暂停  R 阵亡后重开  M 静音  F 全屏

   机制：捡到枪械进入背包可切换；杀僵尸让当前枪械升级(最高15级)；
        每 5 级解锁一项特殊效果并逐层叠加。

   后端：成绩/成就/统计提交到本地 Python 服务(server.py)。
        菜单 L 看排行榜，C 看成就墙，N 改代号。
   ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 1280, H = 720, GROUND_Y = 628, GRAVITY = 2400;
const State = { MENU: 0, PLAYING: 1, OVER: 2, PAUSED: 3, LB: 4, ACH: 5 };
let state = State.MENU, menuSel = 0, playerCount = 2;
const keys = {};

/* ---------------- 后端 / 存档 ---------------- */
// 直接用 file:// 打开时 localStorage 可能被浏览器禁止，读写都要兜住，
// 否则整段脚本会在启动时抛错。此时游戏本体照常可玩，只是不记代号/静音。
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 无存储可用 */ } }

let playerName = lsGet("zs_name") || "";
if (!playerName) { playerName = "幸存者" + (1000 + Math.floor(Math.random() * 9000)); lsSet("zs_name", playerName); }
let muted = lsGet("zs_muted") === "1";
let profileCache = null, lbData = null, achData = null, lbSort = "score", lbLoading = false;
// 首次网络层失败(没起 server.py / 直接 file:// 打开)就转离线模式，不再重试，
// 免得每次操作都在控制台刷 CORS 报错。游戏本体不受影响。
let apiOnline = true;

const api = (path, body) => {
  if (!apiOnline) return Promise.reject(new Error("offline"));
  return fetch(path, body === undefined ? undefined : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  }).then(r => r.json()).catch(err => { apiOnline = false; throw err; });
};

function setPlayerName(n) {
  n = (n || "").replace(/[\r\n\t]/g, "").trim().slice(0, 16);
  if (!n) return;
  playerName = n; lsSet("zs_name", n);
  profileCache = null; achData = null;
}

/* ---------------- 音效 ---------------- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur, type = "square", vol = 0.12, slide = 0) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  shoot() { tone(880, 0.06, "square", 0.05, -500); },
  laser() { tone(1200, 0.12, "sawtooth", 0.06, -900); },
  hit() { tone(320, 0.05, "triangle", 0.08, -120); },
  kill() { tone(180, 0.12, "sawtooth", 0.07, -80); },
  hurt() { tone(140, 0.18, "sawtooth", 0.12, -60); },
  jump() { tone(420, 0.08, "triangle", 0.05, 220); },
  throw() { tone(500, 0.08, "triangle", 0.06, 300); },
  boom() { tone(90, 0.4, "sawtooth", 0.16, -50); tone(60, 0.5, "square", 0.1, -30); },
  pickup() { tone(520, 0.07, "triangle", 0.09, 240); tone(780, 0.09, "triangle", 0.09, 240); },
  levelup() { tone(520, 0.08, "triangle", 0.1); tone(660, 0.08, "triangle", 0.1); tone(880, 0.12, "triangle", 0.1); },
  wave() { tone(660, 0.12, "triangle", 0.1); tone(990, 0.14, "triangle", 0.1); },
};

/* ---------------- 枪械 (含每5级叠加特效) ---------------- */

const SPECIAL_WEAPONS = ["smg", "shotgun", "rifle", "launcher", "laser"];
const WEAPON_SHORT = { pistol: "手枪", smg: "冲锋", shotgun: "霰弹", rifle: "步枪", launcher: "火箭", laser: "激光" };

/* ---------------- 地图 ---------------- */
const MAPS = [
  { name: "城市街区", theme: "city", waves: 5, levelWidth: 5200,
    platforms: [
      { x: 620, y: 490, w: 150, h: 18 }, { x: 1000, y: 430, w: 130, h: 18 },
      { x: 1400, y: 500, w: 150, h: 18 }, { x: 1850, y: 420, w: 130, h: 18 },
      { x: 2250, y: 480, w: 160, h: 18 }, { x: 2700, y: 410, w: 140, h: 18 },
      { x: 3150, y: 490, w: 150, h: 18 }, { x: 3600, y: 430, w: 140, h: 18 },
      { x: 4050, y: 500, w: 160, h: 18 }, { x: 4500, y: 420, w: 140, h: 18 },
    ] },
  { name: "荒漠戈壁", theme: "desert", waves: 5, levelWidth: 5600,
    platforms: [
      { x: 550, y: 480, w: 150, h: 18 }, { x: 950, y: 420, w: 130, h: 18 },
      { x: 1350, y: 500, w: 150, h: 18 }, { x: 1800, y: 430, w: 140, h: 18 },
      { x: 2250, y: 490, w: 160, h: 18 }, { x: 2700, y: 410, w: 130, h: 18 },
      { x: 3200, y: 480, w: 150, h: 18 }, { x: 3700, y: 430, w: 140, h: 18 },
      { x: 4200, y: 500, w: 160, h: 18 }, { x: 4700, y: 420, w: 140, h: 18 },
    ] },
  { name: "极地冰原", theme: "snow", waves: 5, levelWidth: 5400,
    platforms: [
      { x: 600, y: 490, w: 150, h: 18 }, { x: 1000, y: 430, w: 130, h: 18 },
      { x: 1400, y: 500, w: 150, h: 18 }, { x: 1850, y: 420, w: 130, h: 18 },
      { x: 2300, y: 480, w: 160, h: 18 }, { x: 2750, y: 410, w: 140, h: 18 },
      { x: 3200, y: 490, w: 150, h: 18 }, { x: 3650, y: 430, w: 140, h: 18 },
      { x: 4100, y: 500, w: 160, h: 18 }, { x: 4550, y: 420, w: 140, h: 18 },
    ] },
];

/* ---------------- 僵尸类型 ---------------- */
const ZOMBIE_TYPES = {
  walker:  { hp: 45,  speed: 95,  w: 40, h: 62, color: "#7cb96b", xp: 8,  touch: 10, desc: "普通僵尸" },
  runner:  { hp: 26,  speed: 235, w: 30, h: 50, color: "#a8b84a", xp: 10, touch: 8,  desc: "狂奔者" },
  jumper:  { hp: 30,  speed: 270, w: 30, h: 46, color: "#c0b94a", xp: 11, touch: 9,  jump: true, desc: "跳跃者" },
  spitter: { hp: 60,  speed: 60,  w: 40, h: 62, color: "#7fae6b", xp: 16, touch: 7,  gun: true, acid: true, desc: "吐酸者" },
  fat:     { hp: 280, speed: 38,  w: 64, h: 80, color: "#5a8a4e", xp: 26, touch: 20, desc: "胖子" },
  boomer:  { hp: 50,  speed: 125, w: 42, h: 58, color: "#d0a040", xp: 16, touch: 0,  boom: true, desc: "自爆者" },
  shield:  { hp: 180, speed: 50,  w: 46, h: 66, color: "#6b8e4e", xp: 22, touch: 14, armor: 0.6, shield: true, desc: "盾牌僵尸" },
  brute:   { hp: 650, speed: 40,  w: 72, h: 90, color: "#3f6b3a", xp: 70, touch: 26, heavy: true, desc: "巨型僵尸" },
  boss:    { hp: 1400,speed: 30,  w: 120,h: 130,color: "#5a3f8a", xp: 250,touch: 30, gun: true, boss: true, desc: "僵尸王" },
};

/* ---------------- 玩家 ---------------- */
function makePlayer(id) {
  return {
    id, color: id === 0 ? "#4da6ff" : "#ff9b3d",
    controls: id === 0
      ? { left: "KeyA", right: "KeyD", jump: "KeyW", crouch: "KeyS", shoot: "KeyJ", skill: "KeyK", switch: "KeyQ" }
      : { left: "ArrowLeft", right: "ArrowRight", jump: "ArrowUp", crouch: "ArrowDown", shoot: ["Digit1", "Numpad1"], skill: ["Digit2", "Numpad2"], switch: ["Digit3", "Numpad3"] },
    x: 120 + id * 90, y: GROUND_Y, vx: 0, vy: 0, w: 44, h: 68,
    hp: 100, maxHp: 100, lives: 3, dead: false, perma: false, respawnT: 0,
    facing: id === 0 ? 1 : -1, onGround: false, jumps: 0, crouch: false,
    wlv: { pistol: { lv: 1, xp: 0 } }, guns: ["pistol"], gunIdx: 0,
    shootCd: 0, skillCd: 0, invuln: 0,
    _jumpHeld: false, _skillHeld: false, _switchHeld: false, _moveX: 0,
    coyote: 0, jumpBuf: 0,
  };
}
const players = [makePlayer(0), makePlayer(1)];
const activePlayers = () => players.slice(0, playerCount);
function held(p, action) {
  const c = p.controls[action];
  if (Array.isArray(c)) return c.some(k => keys[k] === true);
  return keys[c] === true;
}
function curWeapon(p) { return p.guns[p.gunIdx]; }

/* ---------------- 世界状态 ---------------- */
let camera = { x: 0 };
let currentMap = MAPS[0], mapIndex = 0, levelWidth = 5200, platforms = [];
let bullets = [], enemies = [], particles = [], shells = [], pickups = [], grenades = [], beams = [], floatTexts = [];
let score = 0, kills = 0, wave = 0, waveBudget = 0, spawnedThisWave = 0, spawnTimer = 0;
let waveBanner = 0, mapBanner = 0, shake = 0, runTime = 0;

/* 单局战绩采集：用于后端成就判定与统计 */
let runStats = null, lastSubmit = null;
function newRunStats() {
  return { t0: runTime, damageTaken: 0, firstDamageAt: null, grenadeKills: 0, bossKills: 0,
    mapsCleared: 0, weapons: new Set(["pistol"]), weaponKills: {}, zombieKills: {}, submitted: false };
}
function noteWeapon(id) { if (runStats) runStats.weapons.add(id); }
function noteWeaponKill(id) { if (!runStats || !id || !WEAPONS[id]) return; runStats.weaponKills[id] = (runStats.weaponKills[id] || 0) + 1; }
function noteZombieKill(type) { if (!runStats) return; runStats.zombieKills[type] = (runStats.zombieKills[type] || 0) + 1; }
function buildRunPayload() {
  const rs = runStats || newRunStats(), pcs = activePlayers(), weapons = [];
  let maxLv = 1;
  const ids = new Set(rs.weapons);
  for (const p of pcs) for (const g of p.guns) ids.add(g);
  for (const id of ids) {
    if (!WEAPONS[id]) continue;
    let lv = 1;
    for (const p of pcs) if (p.wlv[id]) lv = Math.max(lv, p.wlv[id].lv);
    maxLv = Math.max(maxLv, lv);
    weapons.push({ id, level: lv, kills: rs.weaponKills[id] || 0 });
  }
  return {
    name: playerName, score, kills, wave, map_index: mapIndex, map_name: currentMap.name,
    duration: Math.max(0, runTime - rs.t0), player_count: playerCount,
    maps_cleared: rs.mapsCleared, boss_kills: rs.bossKills, grenade_kills: rs.grenadeKills,
    max_weapon_level: maxLv, first_damage_at: rs.firstDamageAt,
    weapons, zombies: rs.zombieKills,
  };
}
function submitRun() {
  if (!runStats || runStats.submitted) return;
  runStats.submitted = true;
  lastSubmit = { state: "loading" };
  api("/api/run", buildRunPayload())
    .then(d => {
      if (!d || !d.ok) { lastSubmit = { state: "error", error: (d && d.error) || "服务器拒绝" }; return; }
      lastSubmit = { state: "done", rank: d.rank, personal_best: d.personal_best,
        new_achievements: d.new_achievements || [], profile: d.profile };
      profileCache = d.profile;
    })
    .catch(() => { lastSubmit = { state: "error", error: "连不上服务器，本局成绩未保存" }; });
}
function heartbeat(silent) {
  api("/api/heartbeat", { name: playerName, score, kills, wave, map_name: currentMap.name })
    .then(d => { if (d && d.ok && !silent) addFloat(camera.x + W / 2, 200, "进度已存档", "#7ee787"); })
    .catch(() => {});
}

/* ---------------- 重置 / 地图 ---------------- */
function resetGame() {
  players.forEach(p => {
    p.hp = p.maxHp; p.lives = 3; p.dead = false; p.perma = false; p.respawnT = 0;
    p.wlv = { pistol: { lv: 1, xp: 0 } }; p.guns = ["pistol"]; p.gunIdx = 0;
    p.skillCd = 0; p.invuln = 0; p.shootCd = 0;
    p.coyote = 0; p.jumpBuf = 0; p.jumps = 0;
    p.x = 120 + p.id * 90; p.y = GROUND_Y; p.vx = 0; p.vy = 0; p.facing = p.id === 0 ? 1 : -1;
  });
  score = 0; kills = 0; mapIndex = 0;
  runStats = newRunStats(); lastSubmit = null;
  loadMap(0, true);
}
function loadMap(i, keepWeapon) {
  mapIndex = i; currentMap = MAPS[i];
  platforms = currentMap.platforms; levelWidth = currentMap.levelWidth;
  enemies = []; bullets = []; particles = []; shells = []; pickups = []; grenades = []; beams = []; floatTexts = [];
  wave = 0; waveBudget = 0; spawnedThisWave = 0; spawnTimer = 0; camera.x = 0;
  activePlayers().forEach(p => {
    if (!keepWeapon) { p.wlv = { pistol: { lv: 1, xp: 0 } }; p.guns = ["pistol"]; p.gunIdx = 0; }
    p.dead = false; p.perma = false; p.respawnT = 0;
    p.hp = p.maxHp; p.invuln = 2; p.lives = Math.max(p.lives, 1);
    p.x = 120 + p.id * 90; p.y = GROUND_Y; p.vx = 0; p.vy = 0;
  });
  mapBanner = 2.6; nextWave();
}
function nextWave() {
  wave++;
  waveBudget = (wave === currentMap.waves) ? 1 : (7 + wave * 2 + mapIndex * 2);
  spawnedThisWave = 0; spawnTimer = 1.0; waveBanner = 2.0; sfx.wave();
}

/* ---------------- 僵尸生成 ---------------- */
function difficulty() { return mapIndex * 5 + wave; }
function pickZombieType() {
  const d = difficulty(), pool = ["walker", "walker", "walker"];
  if (d >= 1) pool.push("runner", "runner");
  if (d >= 2) pool.push("jumper");
  if (d >= 3) pool.push("spitter", "spitter");
  if (d >= 4) pool.push("fat");
  if (d >= 5) pool.push("boomer", "boomer");
  if (d >= 6) pool.push("shield");
  if (d >= 7) pool.push("brute");
  return pool[Math.floor(Math.random() * pool.length)];
}
function makeZombie(type, x, dir) {
  const base = ZOMBIE_TYPES[type], diff = difficulty();
  const hpMul = 1 + diff * 0.18;
  const elite = type !== "boss" && wave >= 2 && Math.random() < 0.16;
  const sizeMul = elite ? 1.25 : 1;
  const hp = Math.round(base.hp * hpMul * (elite ? 3 : 1));
  return { type, ...base, x, y: GROUND_Y, vx: 0, vy: 0, w: base.w * sizeMul, h: base.h * sizeMul,
    hp, maxHp: hp, dir, shootCd: 1 + Math.random(), flash: 0, bob: Math.random() * 6.28, elite, minionCd: 4 + Math.random() * 3 };
}
function spawnEnemy() {
  const type = wave === currentMap.waves ? "boss" : pickZombieType();
  const fromRight = Math.random() < 0.85;
  const x = fromRight ? camera.x + W + 80 : Math.max(80, camera.x - 80);
  enemies.push(makeZombie(type, x, fromRight ? -1 : 1));
}
function nearestEnemy(p) {
  let best = null, bd = Infinity;
  for (const e of enemies) { const d = Math.abs(e.x - p.x); if (d < bd) { bd = d; best = e; } }
  return best;
}
function nearestAlivePlayer(x) {
  let best = null, bd = Infinity;
  for (const p of activePlayers()) { if (p.dead) continue; const d = Math.abs(p.x - x); if (d < bd) { bd = d; best = p; } }
  return best;
}

/* ---------------- 特效 ---------------- */
function muzzleFlash(x, y, angle, color = "#ffd94a") {
  for (let i = 0; i < 6; i++) {
    const a = angle + (Math.random() - 0.5) * 0.6, sp = 200 + Math.random() * 300;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.06, maxLife: 0.06, color, size: 3 + Math.random() * 3, type: "spark" });
  }
}
function ejectShell(x, y, dir) { shells.push({ x, y, vx: dir * (60 + Math.random() * 80), vy: -160 - Math.random() * 120, life: 0.8, rot: Math.random() * 6.28 }); }
function blood(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 200;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.4 + Math.random() * 0.4, maxLife: 0.8, color, size: 2 + Math.random() * 3.5, type: "blood" });
  }
}
function explosion(x, y, big = false) {
  const n = big ? 40 : 18;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * (big ? 420 : 240);
    const col = Math.random() < 0.5 ? "#ff9b3d" : (Math.random() < 0.5 ? "#ffd94a" : "#ff5a3c");
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.3 + Math.random() * 0.5, maxLife: 0.8, color: col, size: 2 + Math.random() * (big ? 7 : 4), type: "fire" });
  }
  for (let i = 0; i < (big ? 14 : 6); i++) {
    particles.push({ x: x + (Math.random() - 0.5) * 30, y: y + (Math.random() - 0.5) * 30, vx: (Math.random() - 0.5) * 40, vy: -30 - Math.random() * 60, life: 0.6 + Math.random() * 0.6, maxLife: 1.2, color: "#3a3f4a", size: 6 + Math.random() * (big ? 10 : 5), type: "smoke" });
  }
  shake = big ? 18 : 6; sfx.boom();
}
function addFloat(x, y, txt, color) { floatTexts.push({ x, y, txt, color, life: 0.9, maxLife: 0.9 }); }
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function laserHits(e, x1, y1, x2, y2) {
  const steps = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 12);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    if (x >= e.x && x <= e.x + e.w && y >= e.y && y <= e.y + e.h) return true;
  }
  return false;
}
function aoeDamage(x, y, radius, dmg, src, weaponId) {
  for (const e of enemies) {
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    if (Math.hypot(cx - x, cy - y) <= radius + Math.max(e.w, e.h) / 2) {
      const wid = weaponId || (src ? curWeapon(src) : null);
      damageEnemy(e, dmg, src, wid);
    }
  }
}
function aoeDamagePlayers(x, y, radius, dmg) {
  for (const p of activePlayers()) {
    if (p.dead || p.perma) continue;
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    if (Math.hypot(cx - x, cy - y) <= radius + 20) damagePlayer(p, dmg, cx < x ? -1 : 1);
  }
}

/* ---------------- 武器模组 (等级 + 叠加特效) ---------------- */
function weaponMods(p, id) {
  const w = WEAPONS[id];
  const lv = (p.wlv[id] && p.wlv[id].lv) || 1;
  const m = { dmg: w.dmg * (1 + (lv - 1) * 0.12), rate: w.rate, pellets: w.pellets, spread: w.spread,
    speed: w.speed, type: w.type, color: w.color, crit: 0, pierce: w.type === "pierce" ? 1 : 0, radius: 95, beams: 1 };
  for (const k of [5, 10, 15]) {
    if (lv >= k) {
      const ms = w.milestones[k];
      if (ms.pellets) m.pellets += ms.pellets;
      if (ms.crit) m.crit += ms.crit;
      if (ms.pierce) m.pierce += ms.pierce;
      if (ms.radius) m.radius += ms.radius;
      if (ms.beams) m.beams += ms.beams;
      if (ms.rate) m.rate *= ms.rate;
      if (ms.dmgMult) m.dmg *= ms.dmgMult;
      if (ms.spread) m.spread += ms.spread;
    }
  }
  return m;
}
function rollDmg(m) { return (m.crit > 0 && Math.random() < m.crit) ? m.dmg * 2 : m.dmg; }
function gainWeaponXp(p, id, amount) {
  if (!p.wlv[id]) p.wlv[id] = { lv: 1, xp: 0 };
  const w = p.wlv[id];
  w.xp += amount;
  while (w.lv < 15 && w.xp >= xpNeed(w.lv)) {
    w.xp -= xpNeed(w.lv); w.lv++;
    const ms = WEAPONS[id].milestones[w.lv];
    let txt = WEAPONS[id].name + " Lv." + w.lv;
    if (ms) txt += " · " + ms.desc;
    addFloat(p.x + p.w / 2, p.y - 24, txt, "#ffd94a");
    sfx.levelup();
  }
  if (w.lv >= 15) w.xp = Math.min(w.xp, xpNeed(15));
}

/* ---------------- 玩家动作 ---------------- */
function playerAimAngle(p) {
  let aimY = 0;
  if (held(p, "jump")) aimY = -1; else if (held(p, "crouch")) aimY = 1;
  return p.facing > 0 ? aimY * Math.PI / 4 : Math.PI - aimY * Math.PI / 4;
}
function switchWeapon(p) {
  if (p.guns.length <= 1) return;
  p.gunIdx = (p.gunIdx + 1) % p.guns.length;
  addFloat(p.x + p.w / 2, p.y - 20, WEAPONS[curWeapon(p)].name, "#ffffff");
  sfx.pickup();
}
function playerShoot(p) {
  if (p.dead || p.perma || p.shootCd > 0) return;
  const id = curWeapon(p), w = WEAPONS[id], m = weaponMods(p, id);
  p.shootCd = m.rate;
  if (p._moveX !== 0) p.facing = p._moveX > 0 ? 1 : -1;
  else { const e = nearestEnemy(p); if (e) p.facing = e.x < p.x ? -1 : 1; }
  const ang = playerAimAngle(p);
  const cx = p.x + p.w / 2, cy = p.y + p.h * 0.42;

  if (m.type === "laser") {
    const range = 950, beams = m.beams;
    for (let i = 0; i < beams; i++) {
      const a = ang + (i - (beams - 1) / 2) * 0.06;
      const ex = cx + Math.cos(a) * range, ey = cy + Math.sin(a) * range;
      beams.push({ x1: cx, y1: cy, x2: ex, y2: ey, life: 0.13, color: m.color, w: 3 + Math.min(4, beams) });
      for (const e of enemies) if (laserHits(e, cx, cy, ex, ey)) damageEnemy(e, rollDmg(m), p, id);
    }
    shake = Math.max(shake, 2); sfx.laser();
  } else {
    for (let i = 0; i < m.pellets; i++) {
      const a = ang + (Math.random() - 0.5) * m.spread * 2;
      spawnBullet({ x: cx, y: cy, vx: Math.cos(a) * m.speed, vy: Math.sin(a) * m.speed,
        r: m.type === "explode" ? 6 : 4, life: 1.5, friendly: true, dmg: rollDmg(m), color: m.color,
        type: m.type, pierce: m.pierce, radius: m.radius, weapon: id, owner: p, hit: [] });
    }
    muzzleFlash(cx + Math.cos(ang) * 22, cy + Math.sin(ang) * 22, ang, m.color);
    ejectShell(cx, cy, -p.facing);
    shake = Math.max(shake, m.type === "explode" ? 3 : 1); sfx.shoot();
  }
}
function throwGrenade(p) {
  if (p.dead || p.perma || p.skillCd > 0) return;
  p.skillCd = 6;
  const dir = p.facing, aimY = held(p, "jump") ? -0.6 : 0;
  grenades.push({ x: p.x + p.w / 2, y: p.y + p.h * 0.4, vx: dir * 470, vy: -400 + aimY * 120,
    fuse: 1.6, rot: 0, owner: p });
  sfx.throw();
}
function spawnBullet(o) { bullets.push(o); }

/* ---------------- 伤害 / 击杀 ---------------- */
function damageEnemy(e, dmg, src, weaponId) {
  dmg = Math.round(dmg * (1 - (e.armor || 0)));
  e.hp -= dmg; e.flash = 0.08;
  blood(e.x + e.w / 2, e.y + e.h / 2, "#5a8a3a", 4);
  if (e.hp <= 0) killEnemy(e, src, weaponId);
}
function killEnemy(e, src, weaponId) {
  const i = enemies.indexOf(e); if (i < 0) return;
  enemies.splice(i, 1);
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  explosion(cx, cy, e.boss || e.heavy || e.elite);
  if (e.boom) { aoeDamagePlayers(cx, cy, 130, 28); explosion(cx, cy, true); }
  blood(cx, cy, "#3f7a2a", e.boss ? 24 : 12);
  score += e.xp; kills++;
  noteZombieKill(e.type);
  if (e.boss) runStats.bossKills++;
  if (weaponId === "grenade") runStats.grenadeKills++; else noteWeaponKill(weaponId);
  addFloat(cx, cy - e.h, "+" + e.xp, "#ffe08a");
  if (src && weaponId && WEAPONS[weaponId]) gainWeaponXp(src, weaponId, e.xp);
  dropLoot(e, cx, cy);
  sfx.kill();
}
function explodeZombie(e) {
  const i = enemies.indexOf(e); if (i < 0) return;
  enemies.splice(i, 1);
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  explosion(cx, cy, true); aoeDamagePlayers(cx, cy, 130, 28);
}
function dropLoot(e, x, y) {
  if (e.elite) pickups.push({ x, y, type: "weapon", weapon: SPECIAL_WEAPONS[Math.floor(Math.random() * SPECIAL_WEAPONS.length)], life: 15, vy: -200, onGround: false });
  else {
    const r = Math.random();
    if (r < 0.10) pickups.push({ x, y, type: "med", life: 15, vy: -180, onGround: false });
    else if (r < 0.13) pickups.push({ x, y, type: "life", life: 15, vy: -180, onGround: false });
  }
}
function damagePlayer(p, dmg, dir) {
  if (p.dead || p.perma || p.invuln > 0) return;
  if (runStats) {
    runStats.damageTaken += dmg;
    if (runStats.firstDamageAt === null) runStats.firstDamageAt = runTime - runStats.t0;
  }
  p.hp = Math.max(0, p.hp - dmg);
  p.invuln = 0.8; p.vx += dir * 260; p.vy = -260;
  blood(p.x + p.w / 2, p.y + p.h / 2, "#e74c3c", 10);
  shake = Math.max(shake, 8); sfx.hurt();
  if (p.hp <= 0) killPlayer(p);
}
function killPlayer(p) {
  explosion(p.x + p.w / 2, p.y + p.h / 2, true);
  if (p.lives > 0) { p.lives--; p.dead = true; p.respawnT = 4; }
  else { p.dead = true; p.perma = true; }
  if (activePlayers().every(q => q.perma)) { state = State.OVER; submitRun(); }
}

/* ---------------- 更新 ---------------- */
function update(dt) {
  runTime += dt;
  if (waveBanner > 0) waveBanner -= dt;
  if (mapBanner > 0) mapBanner -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (particles.length > 800) particles.splice(0, particles.length - 800);
  if (shells.length > 200) shells.splice(0, shells.length - 200);
  if (bullets.length > 400) bullets.splice(0, bullets.length - 400);
  if (enemies.length > 60) enemies.splice(0, enemies.length - 60);

  for (const p of activePlayers()) { if (p.dead) updateDead(p, dt); else updatePlayer(p, dt); }
  updateEnemies(dt);
  updateBullets(dt);
  updateGrenades(dt);
  updateParticles(dt);
  updatePickups(dt);
  updateSpawning(dt);

  const alive = activePlayers().filter(q => !q.dead);
  let targetCam = camera.x;
  if (alive.length) { const avg = alive.reduce((s, q) => s + q.x, 0) / alive.length; targetCam = avg - W * 0.42; }
  camera.x += (targetCam - camera.x) * Math.min(1, dt * 6);
  camera.x = Math.max(0, Math.min(levelWidth - W, camera.x));

  floatTexts = floatTexts.filter(f => (f.life -= dt) > 0);
}

function updatePlayer(p, dt) {
  let move = 0;
  if (held(p, "left")) move -= 1;
  if (held(p, "right")) move += 1;
  p._moveX = move;
  p.crouch = held(p, "crouch") && p.onGround;
  p.vx = move * 430 * (p.crouch ? 0.3 : 1);
  if (move !== 0) p.facing = move > 0 ? 1 : -1;

  // 土狼时间(coyote) + 跳跃缓冲(jump buffer)，让起跳更跟手
  if (p.onGround) p.coyote = 0.1; else p.coyote = Math.max(0, p.coyote - dt);
  const jumpHeld = held(p, "jump");
  if (jumpHeld && !p._jumpHeld) p.jumpBuf = 0.14;
  else p.jumpBuf = Math.max(0, p.jumpBuf - dt);
  p._jumpHeld = jumpHeld;
  if (p.jumpBuf > 0) {
    if (p.coyote > 0) { p.vy = -860; p.onGround = false; p.jumps = 1; p.coyote = 0; p.jumpBuf = 0; sfx.jump(); }
    else if (p.jumps < 2) { p.vy = -730; p.jumps++; p.jumpBuf = 0; sfx.jump(); }
  }

  p.vy += GRAVITY * dt; p.x += p.vx * dt; p.y += p.vy * dt;

  p.onGround = false;
  if (p.y + p.h >= GROUND_Y) { p.y = GROUND_Y - p.h; p.vy = 0; p.onGround = true; p.jumps = 0; }
  for (const plat of platforms) {
    if (p.vy >= 0 && p.x + p.w > plat.x && p.x < plat.x + plat.w && p.y + p.h >= plat.y && p.y + p.h <= plat.y + plat.h + 24) {
      p.y = plat.y - p.h; p.vy = 0; p.onGround = true; p.jumps = 0;
    }
  }
  p.x = Math.max(20, Math.min(levelWidth - 20, p.x));

  if (p.shootCd > 0) p.shootCd -= dt;
  if (p.skillCd > 0) p.skillCd -= dt;
  if (p.invuln > 0) p.invuln -= dt;

  if (held(p, "shoot")) playerShoot(p);
  const skillHeld = held(p, "skill");
  if (skillHeld && !p._skillHeld) throwGrenade(p);
  p._skillHeld = skillHeld;
  const switchHeld = held(p, "switch");
  if (switchHeld && !p._switchHeld) switchWeapon(p);
  p._switchHeld = switchHeld;
}

function updateDead(p, dt) {
  if (p.perma) return;
  p.respawnT -= dt;
  if (p.respawnT <= 0) {
    p.dead = false; p.hp = p.maxHp; p.invuln = 2; p.vx = 0; p.vy = 0;
    const ally = activePlayers().find(q => q !== p && !q.dead);
    p.x = ally ? ally.x + (p.id === 0 ? -70 : 70) : 200;
    p.y = GROUND_Y - p.h;
    explosion(p.x + p.w / 2, p.y + p.h / 2, false);
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.flash > 0) e.flash -= dt;
    e.bob += dt * 6; e.shootCd -= dt;
    const target = nearestAlivePlayer(e.x);
    if (!target) continue;
    const dirToP = target.x < e.x ? -1 : 1;
    e.dir = dirToP; e.vx = dirToP * e.speed;
    if (e.gun && !e.boss) { const dist = Math.abs(target.x - e.x); if (dist < 240) e.vx = -dirToP * e.speed * 0.5; }

    if (e.jump) {
      e.vy += GRAVITY * dt; e.y += e.vy * dt;
      if (e.y >= GROUND_Y - e.h) { e.y = GROUND_Y - e.h; e.vy = -620 - Math.random() * 260; }
    } else { e.y = GROUND_Y - e.h; }
    e.x += e.vx * dt;
    e.x = Math.max(40, Math.min(levelWidth - 40, e.x));

    if (e.gun && e.shootCd <= 0 && Math.abs(target.x - e.x) < 680) {
      e.shootCd = e.boss ? 2.0 : 1.7;
      const cx = e.x + e.w / 2, cy = e.y + e.h * 0.4;
      const tx = target.x + target.w / 2, ty = target.y + target.h * 0.4;
      const base = Math.atan2(ty - cy, tx - cx);
      const shots = e.boss ? 3 : 1;
      const color = e.acid ? "#a4e04a" : "#c46bf0";
      for (let i = 0; i < shots; i++) {
        const spread = shots === 1 ? 0 : (i - (shots - 1) / 2) * 0.2;
        spawnBullet({ x: cx, y: cy, vx: Math.cos(base + spread) * 430, vy: Math.sin(base + spread) * 430, r: e.boss ? 6 : 4, life: 2.2, friendly: false, dmg: e.boss ? 18 : 10, color, type: "single", pierce: 0, hit: [] });
      }
      muzzleFlash(cx, cy, base, color);
    }

    if (e.boss) { e.minionCd -= dt; if (e.minionCd <= 0) { e.minionCd = 5; if (enemies.length < 40) enemies.push(makeZombie("walker", e.x - e.dir * 70, -e.dir)); } }

    for (const p of activePlayers()) {
      if (!p.dead && !p.perma && p.invuln <= 0 && aabb(p, e)) {
        if (e.boom) { explodeZombie(e); break; }
        else damagePlayer(p, e.touch, e.x < p.x ? -1 : 1);
      }
    }
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let dead = b.life <= 0 || b.x < camera.x - 120 || b.x > camera.x + W + 120 || b.y < -200 || b.y > H + 200;

    if (!dead && b.friendly) {
      for (const e of enemies) {
        if (b.x > e.x - b.r && b.x < e.x + e.w + b.r && b.y > e.y - b.r && b.y < e.y + e.h + b.r) {
          if (b.type === "explode") { explosion(b.x, b.y, false); aoeDamage(b.x, b.y, b.radius, b.dmg, b.owner, b.weapon); dead = true; }
          else if (b.pierce > 0) {
            if (!b.hit.includes(e)) { b.hit.push(e); damageEnemy(e, b.dmg, b.owner, b.weapon); b.pierce--; }
            if (b.pierce <= 0) dead = true;
          } else { damageEnemy(e, b.dmg, b.owner, b.weapon); dead = true; sfx.hit(); }
          break;
        }
      }
    } else if (!dead && !b.friendly) {
      for (const p of activePlayers()) {
        if (!p.dead && !p.perma && p.invuln <= 0 && b.x > p.x - b.r && b.x < p.x + p.w + b.r && b.y > p.y - b.r && b.y < p.y + p.h + b.r) {
          damagePlayer(p, b.dmg, b.vx > 0 ? -1 : 1); dead = true; break;
        }
      }
    }
    if (dead) bullets.splice(i, 1);
  }
}

function updateGrenades(dt) {
  const R = 7;
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.vy += GRAVITY * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.fuse -= dt;
    g.rot += g.vx * dt * 0.05;
    let boom = g.fuse <= 0;

    if (!boom) {
      // 撞地 / 撞平台：高速弹起，低速贴地滚动
      let floor = null;
      if (g.y >= GROUND_Y - R) floor = GROUND_Y - R;
      for (const pl of platforms) {
        if (g.x > pl.x && g.x < pl.x + pl.w && g.y >= pl.y - R && g.y <= pl.y + pl.h) { floor = pl.y - R; break; }
      }
      if (floor !== null && g.vy >= 0) {
        g.y = floor;
        if (g.vy > 140) { g.vy = -g.vy * 0.45; g.vx *= 0.72; }
        else { g.vy = 0; g.vx *= Math.max(0, 1 - 2.4 * dt); if (Math.abs(g.vx) < 14) g.vx = 0; }
      }
      if (g.x < 24 || g.x > levelWidth - 24) {
        g.x = Math.max(24, Math.min(levelWidth - 24, g.x)); g.vx *= -0.5;
      }
    }
    if (!boom) for (const e of enemies) {
      if (g.x > e.x - 8 && g.x < e.x + e.w + 8 && g.y > e.y - 8 && g.y < e.y + e.h + 8) { boom = true; break; }
    }
    if (boom) { explosion(g.x, g.y, false); aoeDamage(g.x, g.y, 130, 60, g.owner, "grenade"); grenades.splice(i, 1); }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === "blood" || p.type === "fire" || p.type === "smoke") p.vy += 300 * dt;
    if (p.type === "spark") p.vy += 500 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += GRAVITY * dt; s.rot += dt * 12;
    if (s.y > GROUND_Y) { s.y = GROUND_Y; s.vy = 0; s.vx = 0; }
    if (s.life <= 0) shells.splice(i, 1);
  }
  for (let i = beams.length - 1; i >= 0; i--) { beams[i].life -= dt; if (beams[i].life <= 0) beams.splice(i, 1); }
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const pk = pickups[i];
    pk.life -= dt;
    if (!pk.onGround) { pk.vy += GRAVITY * dt; pk.y += pk.vy * dt; if (pk.y >= GROUND_Y - 16) { pk.y = GROUND_Y - 16; pk.onGround = true; } }
    if (pk.life <= 0) { pickups.splice(i, 1); continue; }
    for (const p of activePlayers()) {
      if (p.dead || p.perma) continue;
      if (aabb({ x: p.x, y: p.y, w: p.w, h: p.h }, { x: pk.x - 16, y: pk.y - 16, w: 32, h: 32 })) {
        if (pk.type === "med") { p.hp = Math.min(p.maxHp, p.hp + 30); addFloat(pk.x, pk.y, "+30 HP", "#7ee787"); }
        else if (pk.type === "life") { p.lives = Math.min(5, p.lives + 1); addFloat(pk.x, pk.y, "+1 生命", "#ff9b3d"); }
        else if (pk.type === "weapon") {
          noteWeapon(pk.weapon);
          if (!p.guns.includes(pk.weapon)) {
            p.guns.push(pk.weapon); if (!p.wlv[pk.weapon]) p.wlv[pk.weapon] = { lv: 1, xp: 0 };
            p.gunIdx = p.guns.indexOf(pk.weapon);
            addFloat(pk.x, pk.y, "获得 " + WEAPONS[pk.weapon].name, "#79c0ff");
          } else { p.wlv[pk.weapon].xp += 20; addFloat(pk.x, pk.y, WEAPONS[pk.weapon].name + " 经验+20", "#79c0ff"); }
        }
        sfx.pickup(); pickups.splice(i, 1); break;
      }
    }
  }
}

function updateSpawning(dt) {
  if (spawnedThisWave < waveBudget) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy(); spawnedThisWave++;
      const interval = Math.max(0.3, 1.25 - wave * 0.05);
      spawnTimer = interval * (0.6 + Math.random() * 0.8);
    }
  } else if (enemies.length === 0) {
    if (wave >= currentMap.waves) {
      if (runStats) runStats.mapsCleared++;
      heartbeat(false);                       // 每通关一张图就存档一次
      loadMap((mapIndex + 1) % MAPS.length, true);
    }
    else { nextWave(); activePlayers().forEach(p => { if (!p.dead) p.hp = Math.min(p.maxHp, p.hp + 15); }); }
  }
}

/* ---------------- 渲染 ---------------- */
function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground(); drawPlatforms(); drawPickups(); drawEnemies();
  for (const p of activePlayers()) drawPlayer(p);
  drawBullets(); drawBeams(); drawGrenades(); drawParticles(); drawShells(); drawFloatTexts();
  ctx.restore();
  if (state !== State.MENU && state !== State.LB && state !== State.ACH) drawHUD();
  if (state === State.MENU) drawMenu();
  else if (state === State.OVER) drawGameOver();
  else if (state === State.PAUSED) drawPause();
  else if (state === State.LB) drawLeaderboard();
  else if (state === State.ACH) drawAchievements();
  if (waveBanner > 0 && state === State.PLAYING) drawWaveBanner();

}

/* --- 背景 --- */
const clouds = [];
for (let i = 0; i < 10; i++) clouds.push({ x: Math.random() * 3000, y: 40 + Math.random() * 180, s: 0.5 + Math.random() * 1.4 });
function themeSky() {
  const t = currentMap.theme;
  if (t === "city") return ["#2b2a4a", "#6a5570", "#c07a4a"];
  if (t === "desert") return ["#5a3a2a", "#c07a3a", "#e8b060"];
  return ["#9fc4e8", "#d7e6f2", "#eef4f8"];
}
function themeGround() {
  const t = currentMap.theme;
  if (t === "city") return ["#4a6b3a", "#232b1a", "#6aa84f"];
  if (t === "desert") return ["#d8b060", "#8a6a30", "#e8c878"];
  return ["#eef4f8", "#b8c8d8", "#ffffff"];
}
const _gradCache = {};
function linearGrad(key, x0, y0, x1, y1, stops) {
  if (!_gradCache[key]) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    for (const s of stops) g.addColorStop(s[0], s[1]);
    _gradCache[key] = g;
  }
  return _gradCache[key];
}
function drawBackground() {
  const [skyTop, skyMid, skyBot] = themeSky();
  ctx.fillStyle = linearGrad("sky-" + currentMap.theme, 0, 0, 0, H, [[0, skyTop], [0.6, skyMid], [1, skyBot]]);
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,220,150,0.28)";
  ctx.beginPath(); ctx.arc(W * 0.78 - (camera.x * 0.02 % 300), 120, 70, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  for (const c of clouds) {
    const sx = c.x - camera.x * 0.08;
    const x = ((sx % (W + 300)) + (W + 300)) % (W + 300) - 150;
    ctx.beginPath(); ctx.ellipse(x, c.y, 60 * c.s, 20 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 30 * c.s, c.y - 12 * c.s, 40 * c.s, 16 * c.s, 0, 0, Math.PI * 2); ctx.fill();
  }
  const t = currentMap.theme;
  if (t === "city") { ctx.fillStyle = "#1c1e33"; drawSilhouette(0.5, 520, 95, 1); ctx.fillStyle = "#232540"; drawSilhouette(0.3, 430, 150, 2); }
  else if (t === "desert") { ctx.fillStyle = "#b8874a"; drawDunes(0.25, 480, 120, 1); ctx.fillStyle = "#9a6a38"; drawDunes(0.45, 540, 70, 2); }
  else { ctx.fillStyle = "#b8ccdd"; drawSilhouette(0.3, 460, 180, 1); ctx.fillStyle = "#9fb8cc"; drawSilhouette(0.45, 520, 90, 2); }

  const [gTop, gBot, gStrip] = themeGround();
  ctx.fillStyle = linearGrad("ground-" + currentMap.theme, 0, GROUND_Y, 0, H, [[0, gTop], [0.12, gTop], [1, gBot]]);
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = gStrip; ctx.fillRect(0, GROUND_Y, W, 6);
  ctx.fillStyle = "rgba(0,0,0,0.14)";
  for (let i = 0; i < 40; i++) { const gx = ((i * 160 - camera.x) % W + W) % W; ctx.fillRect(gx, GROUND_Y + 30 + (i % 3) * 22, 8 + (i % 5) * 3, 4); }
  if (t === "snow") {
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    for (let i = 0; i < 80; i++) { const fx = (i * 137 + Math.sin(runTime * 0.7 + i) * 40) % W; const fy = (i * 89 + runTime * (40 + i % 3 * 20)) % H; ctx.fillRect(fx, fy, 2, 2); }
  }
}
function drawSilhouette(parallax, baseY, height, seed) {
  ctx.beginPath(); ctx.moveTo(0, H);
  const step = 90, off = -camera.x * parallax, cols = Math.ceil(W / step) + 2;
  for (let i = 0; i < cols; i++) {
    const wx = i * step + (off % step);
    const n = Math.abs(Math.sin(i * 1.7 + seed * 5 + Math.floor(off / step) * 0.9));
    const h = height * (0.4 + n * 0.6);
    ctx.lineTo(wx, baseY - h); ctx.lineTo(wx + step * 0.5, baseY - h - 24); ctx.lineTo(wx + step, baseY - height * 0.4);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function drawDunes(parallax, baseY, height, seed) {
  ctx.beginPath(); ctx.moveTo(0, H);
  const step = 140, off = -camera.x * parallax, cols = Math.ceil(W / step) + 2;
  for (let i = 0; i < cols; i++) {
    const wx = i * step + (off % step);
    const n = Math.abs(Math.sin(i * 1.3 + seed * 3 + Math.floor(off / step) * 0.6));
    ctx.quadraticCurveTo(wx + step * 0.5, baseY - height * (0.5 + n), wx + step, baseY - height * 0.3);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function drawPlatforms() {
  for (const pl of platforms) {
    if (pl.x + pl.w < camera.x - 20 || pl.x > camera.x + W + 20) continue;
    const x = pl.x - camera.x, t = currentMap.theme;
    ctx.fillStyle = t === "desert" ? "#9a6a38" : (t === "snow" ? "#8fb0c8" : "#5a4632");
    ctx.fillRect(x, pl.y, pl.w, pl.h);
    ctx.fillStyle = t === "desert" ? "#e8c878" : (t === "snow" ? "#ffffff" : "#7ac74f");
    ctx.fillRect(x, pl.y, pl.w, 6);
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(x, pl.y + pl.h - 4, pl.w, 4);
  }
}

/* --- 玩家渲染 --- */
function drawPlayer(p) {
  if (p.dead) return;
  const x = p.x - camera.x, y = p.y;
  if (p.invuln > 0 && Math.floor(p.invuln * 20) % 2 === 0) return;
  ctx.save();
  const hh = p.crouch ? p.h * 0.7 : p.h, bodyY = y + (p.h - hh), cx = x + p.w / 2;
  ctx.fillStyle = "#2f3542";
  ctx.fillRect(x + 10, bodyY + hh * 0.55, 10, y + p.h - bodyY - hh * 0.55);
  ctx.fillRect(x + p.w - 20, bodyY + hh * 0.55, 10, y + p.h - bodyY - hh * 0.55);
  const grad = ctx.createLinearGradient(cx, bodyY, cx, bodyY + hh);
  grad.addColorStop(0, p.color); grad.addColorStop(1, shade(p.color));
  ctx.fillStyle = grad; roundRect(x + 6, bodyY, p.w - 12, hh * 0.62, 5); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(x + 10, bodyY + hh * 0.12, p.w - 20, hh * 0.26);
  ctx.fillStyle = "#eab676"; ctx.beginPath(); ctx.arc(cx + p.facing * 2, bodyY - 6, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shade(p.color); ctx.beginPath(); ctx.arc(cx + p.facing * 2, bodyY - 8, 12, Math.PI, Math.PI * 2); ctx.fill();
  const w = WEAPONS[curWeapon(p)];
  const ang = playerAimAngle(p);
  ctx.strokeStyle = "#14161c"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(cx, bodyY + hh * 0.4); ctx.lineTo(cx + Math.cos(ang) * 34, bodyY + hh * 0.4 + Math.sin(ang) * 34); ctx.stroke();
  ctx.fillStyle = w.color; ctx.fillRect(cx + Math.cos(ang) * 30 - 4, bodyY + hh * 0.4 + Math.sin(ang) * 30 - 4, 9, 9);
  ctx.restore();
}
const _shadeCache = {};
function shade(hex) {
  if (_shadeCache[hex]) return _shadeCache[hex];
  const n = parseInt(hex.replace("#", ""), 16);
  const r = Math.max(0, (n >> 16 & 255) - 40), g = Math.max(0, (n >> 8 & 255) - 40), b = Math.max(0, (n & 255) - 40);
  const c = "rgb(" + r + "," + g + "," + b + ")";
  _shadeCache[hex] = c; return c;
}

/* --- 僵尸渲染 --- */
function drawEnemies() {
  for (const e of enemies) drawZombie(e);
}
function drawZombie(e) {
  const x = e.x - camera.x, y = e.y, w = e.w, h = e.h;
  ctx.save();
  ctx.translate(0, Math.sin(e.bob) * 2);
  if (e.elite) {
    ctx.strokeStyle = "#ff3b3b"; ctx.lineWidth = 3; ctx.globalAlpha = 0.55 + Math.sin(runTime * 8) * 0.3;
    ctx.strokeRect(x - 4, y - 4, w + 8, h + 8); ctx.globalAlpha = 1;
  }
  const skin = e.flash > 0 ? "#ffffff" : e.color;
  // 腿
  ctx.fillStyle = shade(e.color);
  ctx.fillRect(x + w * 0.2, y + h * 0.55, w * 0.22, h * 0.45);
  ctx.fillRect(x + w * 0.58, y + h * 0.55, w * 0.22, h * 0.45);
  // 身体
  ctx.fillStyle = skin;
  roundRect(x + w * 0.1, y + h * 0.3, w * 0.8, h * 0.42, 4); ctx.fill();
  // 手臂 (前伸)
  ctx.fillStyle = skin;
  ctx.fillRect(x + w * 0.02, y + h * 0.38, w * 0.22, h * 0.42);
  ctx.fillRect(x + w * 0.76, y + h * 0.38, w * 0.22, h * 0.42);
  // 头
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(x + w / 2 + e.dir * 2, y + h * 0.16, w * 0.22, 0, Math.PI * 2); ctx.fill();
  // 发光红眼 (廉价光晕替代 shadowBlur)
  const ex = x + w / 2 + e.dir * w * 0.06, ey = y + h * 0.14, er = Math.max(1.6, w * 0.045);
  ctx.fillStyle = "rgba(255,42,42,0.35)";
  ctx.beginPath(); ctx.arc(ex - w * 0.07, ey, er * 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex + w * 0.07, ey, er * 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ff2a2a";
  ctx.beginPath(); ctx.arc(ex - w * 0.07, ey, er, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex + w * 0.07, ey, er, 0, Math.PI * 2); ctx.fill();
  // 类型特征
  if (e.shield) { ctx.fillStyle = "#9aa4b2"; ctx.fillRect(x + (e.dir > 0 ? -w * 0.12 : w * 0.0), y + h * 0.2, w * 0.16, h * 0.6); }
  if (e.boom) { ctx.fillStyle = "rgba(255,120,40,0.45)"; ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.35, w * 0.42, 0, Math.PI * 2); ctx.fill(); }
  if (e.acid) { ctx.fillStyle = "#a4e04a"; ctx.beginPath(); ctx.arc(x + w / 2 - e.dir * w * 0.3, y + h * 0.45, w * 0.15, 0, Math.PI * 2); ctx.fill(); }
  if (e.boss) {
    ctx.fillStyle = "#ffd94a";
    ctx.beginPath();
    ctx.moveTo(x + w * 0.32, y + h * 0.02); ctx.lineTo(x + w * 0.32, y - h * 0.12);
    ctx.lineTo(x + w * 0.44, y + h * 0.0); ctx.lineTo(x + w * 0.5, y - h * 0.16);
    ctx.lineTo(x + w * 0.56, y + h * 0.0); ctx.lineTo(x + w * 0.68, y - h * 0.12);
    ctx.lineTo(x + w * 0.68, y + h * 0.02); ctx.closePath(); ctx.fill();
  }
  if (e.hp < e.maxHp) {
    const bw = w;
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(x, y - 12, bw, 5);
    ctx.fillStyle = e.elite ? "#ffd94a" : "#3fb950"; ctx.fillRect(x, y - 12, bw * (e.hp / e.maxHp), 5);
  }
  ctx.restore();
}

/* --- 子弹/光束/手雷/粒子/弹壳/拾取 --- */
function drawBullets() {
  for (const b of bullets) {
    const x = b.x - camera.x;
    ctx.save(); ctx.translate(x, b.y);
    const ang = Math.atan2(b.vy, b.vx); ctx.rotate(ang);
    ctx.fillStyle = b.color; ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(0, 0, b.r * 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillRect(-b.r * 2.2, -b.r * 0.5, b.r * 4.4, b.r);
    ctx.restore();
  }
}
function drawBeams() {
  for (const b of beams) {
    ctx.save();
    ctx.globalAlpha = 0.35; ctx.strokeStyle = b.color; ctx.lineWidth = b.w * 2.5;
    ctx.beginPath(); ctx.moveTo(b.x1 - camera.x, b.y1); ctx.lineTo(b.x2 - camera.x, b.y2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.strokeStyle = b.color; ctx.lineWidth = b.w;
    ctx.beginPath(); ctx.moveTo(b.x1 - camera.x, b.y1); ctx.lineTo(b.x2 - camera.x, b.y2); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = b.w * 0.4;
    ctx.beginPath(); ctx.moveTo(b.x1 - camera.x, b.y1); ctx.lineTo(b.x2 - camera.x, b.y2); ctx.stroke();
    ctx.restore();
  }
}
function drawGrenades() {
  for (const g of grenades) {
    ctx.save(); ctx.translate(g.x - camera.x, g.y);
    ctx.rotate(g.rot || 0);
    ctx.fillStyle = "#3a6a2a"; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
    ctx.restore();
    const blinkRate = g.fuse < 0.6 ? 30 : 14;
    ctx.fillStyle = Math.floor(g.fuse * blinkRate) % 2 === 0 ? "#ff5a3c" : "#ffd94a";
    ctx.beginPath(); ctx.arc(g.x - camera.x, g.y - 10, 2.5, 0, Math.PI * 2); ctx.fill();
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = p.type === "smoke" ? a * 0.5 : a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x - camera.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawShells() {
  for (const s of shells) {
    ctx.save(); ctx.translate(s.x - camera.x, s.y); ctx.rotate(s.rot);
    ctx.fillStyle = "#d9a441"; ctx.fillRect(-3, -1.5, 6, 3); ctx.restore();
  }
}
function drawPickups() {
  for (const pk of pickups) {
    const x = pk.x - camera.x;
    const pulse = 1 + Math.sin(runTime * 6 + pk.x) * 0.08;
    ctx.save(); ctx.translate(x, pk.y); ctx.scale(pulse, pulse);
    const halo = pk.type === "med" ? "#7ee787" : pk.type === "life" ? "#ff9b3d" : WEAPONS[pk.weapon].color;
    ctx.globalAlpha = 0.25; ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    if (pk.type === "med") {
      ctx.fillStyle = "#fff"; roundRect(-12, -12, 24, 24, 6); ctx.fill();
      ctx.fillStyle = "#e74c3c"; ctx.fillRect(-8, -3, 16, 6); ctx.fillRect(-3, -8, 6, 16);
    } else if (pk.type === "life") {
      ctx.fillStyle = "#ff9b3d";
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("♥", 0, 1);
    } else {
      ctx.fillStyle = WEAPONS[pk.weapon].color;
      roundRect(-13, -9, 26, 18, 3); ctx.fill();
      ctx.fillStyle = "#1c1c1c"; ctx.fillRect(-11, -9, 22, 4);
      ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(WEAPONS[pk.weapon].name[0], 0, 3);

}
function drawFloatTexts() {
  for (const f of floatTexts) {

    ctx.font = "bold 18px 'Microsoft YaHei', sans-serif"; ctx.textAlign = "center";

function drawPlayerPanel(p, x, align) {
  const pw = 264, ph = 128;
  const px = align === "left" ? x : x - pw;
  ctx.fillStyle = "rgba(0,0,0,0.5)"; roundRect(px, 74, pw, ph, 8); ctx.fill();
  ctx.textAlign = align;
  const L = px + 14, R = px + pw - 14;

  ctx.fillStyle = p.color; ctx.font = "bold 15px 'Microsoft YaHei', sans-serif";
  ctx.fillText("P" + (p.id + 1), L, 94);
  ctx.fillStyle = "#ff9b3d"; ctx.textAlign = align === "left" ? "right" : "left";
  ctx.font = "bold 13px sans-serif";
  ctx.fillText("♥".repeat(Math.max(0, p.lives)), align === "left" ? R : L, 94);

  // 血条
  const hpRatio = Math.max(0, p.hp / p.maxHp);
  ctx.fillStyle = "rgba(0,0,0,0.5)"; roundRect(L, 100, pw - 28, 12, 4); ctx.fill();
  ctx.fillStyle = hpRatio > 0.3 ? "#3fb950" : "#e74c3c"; roundRect(L + 2, 102, (pw - 32) * hpRatio, 8, 3); ctx.fill();

  // 当前武器 + 等级
  const wid = curWeapon(p), wl = p.wlv[wid] || { lv: 1, xp: 0 };
  ctx.textAlign = align;
  ctx.fillStyle = WEAPONS[wid].color; ctx.font = "bold 14px 'Microsoft YaHei', sans-serif";
  ctx.fillText(WEAPONS[wid].name + "  Lv." + wl.lv, L, 124);
  ctx.fillStyle = "#8a94a6"; ctx.font = "12px 'Microsoft YaHei', sans-serif";
  ctx.fillText(p.id === 0 ? "Q换枪" : "3换枪", align === "left" ? R : L, 124);

  // 武器经验条
  const need = wl.lv >= 15 ? 1 : xpNeed(wl.lv), xr = wl.lv >= 15 ? 1 : Math.min(1, wl.xp / need);
  ctx.fillStyle = "rgba(0,0,0,0.5)"; roundRect(L, 130, pw - 28, 6, 3); ctx.fill();
  ctx.fillStyle = WEAPONS[wid].color; roundRect(L + 1, 131, (pw - 30) * xr, 4, 2); ctx.fill();

  // 手雷技能冷却
  const skillRatio = Math.max(0, 1 - p.skillCd / 6);
  ctx.fillStyle = "#9aa4b2"; ctx.font = "12px 'Microsoft YaHei', sans-serif"; ctx.textAlign = align;
  ctx.fillText("手雷", L, 152);
  ctx.fillStyle = "rgba(0,0,0,0.5)"; roundRect(L + 38, 145, 60, 8, 3); ctx.fill();
  ctx.fillStyle = skillRatio >= 1 ? "#58a6ff" : "#8a94a6"; roundRect(L + 39, 146, 58 * skillRatio, 6, 2); ctx.fill();

  // 背包 (拥有的枪)
  let chipX = L + 112;
  for (const gid of p.guns) {
    const isCur = gid === wid;
    ctx.fillStyle = isCur ? WEAPONS[gid].color : "rgba(255,255,255,0.12)";
    roundRect(chipX, 140, 40, 18, 3); ctx.fill();
    if (isCur) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; roundRect(chipX, 140, 40, 18, 3); ctx.stroke(); }
    ctx.fillStyle = "#fff"; ctx.font = "10px 'Microsoft YaHei', sans-serif"; ctx.textAlign = "center";
    ctx.fillText(WEAPON_SHORT[gid] + (p.wlv[gid] ? p.wlv[gid].lv : 1), chipX + 20, 152);
    chipX += 45;
  }

  // 死亡状态
  if (p.dead) {
    ctx.fillStyle = "rgba(0,0,0,0.55)"; roundRect(px, 74, pw, ph, 8); ctx.fill();
    ctx.fillStyle = p.perma ? "#e74c3c" : "#f6c24a";
    ctx.font = "bold 15px 'Microsoft YaHei', sans-serif"; ctx.textAlign = "center";
    ctx.fillText(p.perma ? "阵亡" : "复活 " + Math.ceil(p.respawnT) + "s", px + pw / 2, 140);
  }
}

function loadProfile() {

    .then(d => { if (d && d.achievements) { profileCache = d; achData = d; } })
    .catch(() => {});

let overlayReturn = State.MENU;
function openLeaderboard() {
  if (state !== State.LB) overlayReturn = state;

  achData = null; loadProfile();
}
function closeOverlay() { if (overlayReturn === State.OVER) state = State.OVER; else backToMenu(); }
function backToMenu() { state = State.MENU; loadProfile(); }

function drawMenu() {
  ctx.fillStyle = "rgba(10,14,22,0.88)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#7ee787"; ctx.font = "bold 58px 'Microsoft YaHei', sans-serif";
  ctx.fillText("丧 尸 围 城", W / 2, 108);
  ctx.fillStyle = "#c8d2e0"; ctx.font = "20px 'Microsoft YaHei', sans-serif";
  ctx.fillText("双 人 合 作 · 横 版 枪 战", W / 2, 146);

  for (let i = 0; i < menuButtons.length; i++) {
    const b = menuButtons[i], sel = i === menuSel, y = btnY(i);
    ctx.fillStyle = sel ? "rgba(126,231,135,0.18)" : "rgba(255,255,255,0.06)";
    roundRect(BTN_X, y, BTN_W, BTN_H, 10); ctx.fill();
    if (sel) { ctx.strokeStyle = "#7ee787"; ctx.lineWidth = 2; roundRect(BTN_X, y, BTN_W, BTN_H, 10); ctx.stroke(); }
    ctx.textAlign = "left"; ctx.fillStyle = sel ? "#7ee787" : "#e6ecf5";
    ctx.font = "bold 23px 'Microsoft YaHei', sans-serif";
    ctx.fillText(b.label, BTN_X + 34, y + 34);
    ctx.textAlign = "right"; ctx.fillStyle = "#8a94a6"; ctx.font = "14px 'Microsoft YaHei', sans-serif";
    ctx.fillText(b.sub, BTN_X + BTN_W - 34, y + 34);
  }

  // 档案条
  const py = btnY(menuButtons.length) + 12;
  ctx.fillStyle = "rgba(0,0,0,0.42)"; roundRect(W / 2 - 320, py, 640, 78, 10); ctx.fill();
  ctx.textAlign = "center";
  ctx.fillStyle = "#79c0ff"; ctx.font = "bold 17px 'Microsoft YaHei', sans-serif";
  ctx.fillText("代号  " + playerName, W / 2, py + 26);
  ctx.fillStyle = "#8a94a6"; ctx.font = "13px 'Microsoft YaHei', sans-serif";
  if (!apiOnline) {
    ctx.fillStyle = "#f6c24a";
    ctx.fillText("离线模式 · 未连接 server.py，本局成绩不会保存", W / 2, py + 50);
  } else if (profileCache && profileCache.exists === false) {
    ctx.fillText("还没有战绩 · 打完一局就会出现在排行榜上", W / 2, py + 50);
  } else if (profileCache) {
    ctx.fillText("最高分 " + profileCache.best_score + "   ·   累计击杀 " + profileCache.total_kills +
      "   ·   游玩 " + profileCache.total_runs + " 局   ·   成就 " +
      profileCache.achievement_count + "/" + profileCache.achievements.length, W / 2, py + 50);
  } else {
    ctx.fillText("按 N 修改代号 · 成绩自动上传到本地服务器", W / 2, py + 50);
  }
  ctx.fillStyle = muted ? "#e74c3c" : "#4a5568"; ctx.font = "12px 'Microsoft YaHei', sans-serif";
  ctx.fillText(muted ? "已静音 (M 开启音效)" : "音效开启 (M 静音)", W / 2, py + 68);

  ctx.fillStyle = "#6b7688"; ctx.font = "14px 'Microsoft YaHei', sans-serif";
  ctx.fillText("↑/↓ 或 W/S 选择   ·   回车 / 点击 开始   ·   N 改代号   ·   M 静音   ·   F 全屏", W / 2, 604);
  ctx.fillText("1P: A/D 移动 · W 跳 · S 蹲 · J 射击 · K 手雷 · Q 换枪", W / 2, 634);
  ctx.fillText("2P: ←/→ 移动 · ↑ 跳 · ↓ 蹲 · 1 射击 · 2 手雷 · 3 换枪", W / 2, 658);
  ctx.fillText("捡枪入背包 · 杀僵尸给枪升级(最高15级) · 每5级特效叠加 · 精英必掉枪", W / 2, 682);
}

/* --- 排行榜 --- */
function drawLeaderboard() {
  ctx.fillStyle = "rgba(10,14,22,0.95)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd94a"; ctx.font = "bold 38px 'Microsoft YaHei', sans-serif";
  ctx.fillText("排 行 榜", W / 2, 56);

  let sx = W / 2 - 156;
  for (const [key, label] of [["score", "得分"], ["kills", "击杀"], ["wave", "波数"]]) {
    const on = lbSort === key;
    ctx.fillStyle = on ? "rgba(255,217,74,0.20)" : "rgba(255,255,255,0.06)";
    roundRect(sx, 74, 96, 30, 6); ctx.fill();
    if (on) { ctx.strokeStyle = "#ffd94a"; ctx.lineWidth = 1.5; roundRect(sx, 74, 96, 30, 6); ctx.stroke(); }
    ctx.fillStyle = on ? "#ffd94a" : "#8a94a6"; ctx.font = "bold 15px 'Microsoft YaHei', sans-serif";
    ctx.fillText(label, sx + 48, 94);
    sx += 108;
  }

  if (lbLoading) {
    ctx.fillStyle = "#8a94a6"; ctx.font = "18px 'Microsoft YaHei', sans-serif";
    ctx.fillText("读取中…", W / 2, 200);
  } else if (!lbData || !lbData.length) {
    ctx.fillStyle = "#8a94a6"; ctx.font = "18px 'Microsoft YaHei', sans-serif";
    ctx.fillText("还没有成绩记录 —— 去打一局吧", W / 2, 200);
  } else {
    const top = 140, rowH = 32, x0 = W / 2 - 470, w = 940;
    ctx.textAlign = "left"; ctx.font = "bold 13px 'Microsoft YaHei', sans-serif"; ctx.fillStyle = "#6b7688";
    ctx.fillText("#", x0 + 12, top - 8);
    ctx.fillText("代号", x0 + 58, top - 8);
    ctx.textAlign = "right";
    ctx.fillText("得分", x0 + 400, top - 8);
    ctx.fillText("击杀", x0 + 496, top - 8);
    ctx.fillText("波数", x0 + 572, top - 8);
    ctx.fillText("枪械", x0 + 660, top - 8);
    ctx.textAlign = "left";
    ctx.fillText("地图", x0 + 700, top - 8);
    ctx.fillText("模式", x0 + 830, top - 8);

    for (let i = 0; i < lbData.length; i++) {
      const e = lbData[i], y = top + i * rowH, mine = e.name === playerName;
      if (mine) { ctx.fillStyle = "rgba(121,192,255,0.16)"; roundRect(x0, y - 20, w, rowH - 4, 5); ctx.fill(); }
      else if (i % 2 === 0) { ctx.fillStyle = "rgba(255,255,255,0.03)"; roundRect(x0, y - 20, w, rowH - 4, 5); ctx.fill(); }
      ctx.textAlign = "left"; ctx.font = "bold 15px 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = ["#ffd94a", "#c8d2e0", "#cd7f32"][i] || "#5a6472";
      ctx.fillText(String(i + 1), x0 + 12, y);
      ctx.fillStyle = mine ? "#79c0ff" : "#dfe6f0"; ctx.fillText(e.name, x0 + 58, y);
      ctx.textAlign = "right"; ctx.font = "bold 15px sans-serif";
      ctx.fillStyle = "#ffd94a"; ctx.fillText(String(e.score), x0 + 400, y);
      ctx.fillStyle = "#c8d2e0"; ctx.fillText(String(e.kills), x0 + 496, y);
      ctx.fillText(String(e.wave), x0 + 572, y);
      ctx.fillStyle = e.max_weapon_level >= 15 ? "#7ee787" : "#8a94a6";
      ctx.fillText("Lv." + e.max_weapon_level, x0 + 660, y);
      ctx.textAlign = "left"; ctx.font = "14px 'Microsoft YaHei', sans-serif"; ctx.fillStyle = "#8a94a6";
      ctx.fillText(e.map_name || "-", x0 + 700, y);
      ctx.fillText(e.player_count === 2 ? "双人" : "单人", x0 + 830, y);
      ctx.fillStyle = "#5a6472"; ctx.font = "12px sans-serif";
      ctx.fillText(Math.round(e.duration) + "s", x0 + 880, y);
    }
  }
  ctx.textAlign = "center"; ctx.fillStyle = "#6b7688"; ctx.font = "14px 'Microsoft YaHei', sans-serif";
  ctx.fillText("←/→ 或 A/D 切换排序    ·    Esc / L 返回", W / 2, H - 26);
}

/* --- 成就墙 --- */
function drawAchievements() {
  ctx.fillStyle = "rgba(10,14,22,0.95)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#a78bfa"; ctx.font = "bold 38px 'Microsoft YaHei', sans-serif";
  ctx.fillText("成 就 墙", W / 2, 52);

  const list = (achData && achData.achievements) || [];
  if (!list.length) {
    ctx.fillStyle = "#8a94a6"; ctx.font = "17px 'Microsoft YaHei', sans-serif";
    ctx.fillText(achData === null ? "读取中…" : "暂无档案 —— 先打一局再来", W / 2, 200);
  } else {
    const got = achData.achievement_count;
    ctx.fillStyle = "#c8d2e0"; ctx.font = "17px 'Microsoft YaHei', sans-serif";
    ctx.fillText(playerName + "　已解锁 " + got + " / " + list.length, W / 2, 84);
    ctx.fillStyle = "rgba(255,255,255,0.08)"; roundRect(W / 2 - 220, 98, 440, 8, 4); ctx.fill();
    ctx.fillStyle = "#a78bfa"; roundRect(W / 2 - 220, 98, 440 * (got / list.length), 8, 4); ctx.fill();

    const cols = 2, cw = 600, ch = 52, x0 = W / 2 - 620, y0 = 130;
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      const cx = x0 + (i % cols) * (cw + 20), cy = y0 + Math.floor(i / cols) * (ch + 8);
      ctx.fillStyle = a.unlocked ? "rgba(167,139,250,0.16)" : "rgba(255,255,255,0.04)";
      roundRect(cx, cy, cw, ch, 8); ctx.fill();
      ctx.strokeStyle = a.unlocked ? TIER_COLOR[a.tier] : "rgba(255,255,255,0.08)";
      ctx.lineWidth = a.unlocked ? 2 : 1; roundRect(cx, cy, cw, ch, 8); ctx.stroke();
      ctx.globalAlpha = a.unlocked ? 1 : 0.5;
      ctx.textAlign = "left"; ctx.font = "24px sans-serif";
      ctx.fillText(a.unlocked ? a.icon : "🔒", cx + 14, cy + 36);
      ctx.font = "bold 16px 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = a.unlocked ? TIER_COLOR[a.tier] : "#6b7688";
      ctx.fillText(a.name, cx + 56, cy + 24);
      ctx.font = "13px 'Microsoft YaHei', sans-serif"; ctx.fillStyle = "#8a94a6";
      ctx.fillText(a.desc, cx + 56, cy + 43);
      ctx.textAlign = "right"; ctx.font = "12px 'Microsoft YaHei', sans-serif";
      ctx.fillStyle = a.unlocked ? "#7ee787" : "#4a5568";
      ctx.fillText(a.unlocked ? String(a.unlocked_at || "").slice(0, 10) : "未解锁", cx + cw - 14, cy + 31);
      ctx.globalAlpha = 1;
    }
  }
  ctx.textAlign = "center"; ctx.fillStyle = "#6b7688"; ctx.font = "14px 'Microsoft YaHei', sans-serif";
  ctx.fillText("Esc / C 返回", W / 2, H - 26);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(10,10,16,0.88)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#e74c3c"; ctx.font = "bold 54px 'Microsoft YaHei', sans-serif";
  ctx.fillText("全 军 覆 没", W / 2, 112);
  ctx.fillStyle = "#fff"; ctx.font = "bold 42px 'Microsoft YaHei', sans-serif";
  ctx.fillText("最终得分 " + score, W / 2, 172);
  ctx.fillStyle = "#9aa4b2"; ctx.font = "16px 'Microsoft YaHei', sans-serif";
  const secs = Math.round(runTime - (runStats ? runStats.t0 : runTime));
  ctx.fillText(playerName + " · 到达 " + currentMap.name + " 第 " + wave + " 波 · 击杀 " + kills +
    " 只 · 存活 " + secs + " 秒", W / 2, 202);
  if (runStats) {
    ctx.fillStyle = "#6b7688"; ctx.font = "14px 'Microsoft YaHei', sans-serif";
    ctx.fillText("手雷击杀 " + runStats.grenadeKills + " · 通关地图 " + runStats.mapsCleared +
      " · 击杀僵尸王 " + runStats.bossKills + " · 承伤 " + runStats.damageTaken, W / 2, 228);
  }

  if (lastSubmit) {
    if (lastSubmit.state === "loading") {
      ctx.fillStyle = "#8a94a6"; ctx.font = "16px 'Microsoft YaHei', sans-serif";
      ctx.fillText("正在上传战绩…", W / 2, 266);
    } else if (lastSubmit.state === "error") {
      ctx.fillStyle = "#e74c3c"; ctx.font = "16px 'Microsoft YaHei', sans-serif";
      ctx.fillText("成绩未保存：" + lastSubmit.error, W / 2, 266);
    } else {
      ctx.fillStyle = lastSubmit.personal_best ? "#ffd94a" : "#79c0ff";
      ctx.font = "bold 20px 'Microsoft YaHei', sans-serif";
      ctx.fillText(lastSubmit.personal_best
        ? "★ 个人最佳纪录！ 服务器排名 #" + lastSubmit.rank
        : "服务器排名 #" + lastSubmit.rank, W / 2, 266);

      const na = lastSubmit.new_achievements || [];
      if (na.length) {
        ctx.fillStyle = "#a78bfa"; ctx.font = "bold 16px 'Microsoft YaHei', sans-serif";
        ctx.fillText("解锁 " + na.length + " 项新成就" + (na.length > 4 ? "（前 4 项）" : ""), W / 2, 298);
        const per = Math.min(4, na.length), cw = 236, x0 = W / 2 - per * cw / 2;
        for (let i = 0; i < per; i++) {
          const a = na[i], x = x0 + i * cw;
          ctx.fillStyle = "rgba(167,139,250,0.16)"; roundRect(x + 4, 312, cw - 8, 46, 7); ctx.fill();
          ctx.strokeStyle = TIER_COLOR[a.tier]; ctx.lineWidth = 1.5;
          roundRect(x + 4, 312, cw - 8, 46, 7); ctx.stroke();
          ctx.textAlign = "left"; ctx.font = "20px sans-serif"; ctx.fillText(a.icon, x + 14, 342);
          ctx.fillStyle = TIER_COLOR[a.tier]; ctx.font = "bold 14px 'Microsoft YaHei', sans-serif";
          ctx.fillText(a.name, x + 42, 332);
          ctx.fillStyle = "#8a94a6"; ctx.font = "11px 'Microsoft YaHei', sans-serif";
          ctx.fillText(a.desc, x + 42, 349);
          ctx.textAlign = "center";
        }
      }
    }
  }

  const blink = Math.sin(runTime * 4) > 0;
  ctx.fillStyle = blink ? "#fff" : "#8a94a6"; ctx.font = "bold 22px 'Microsoft YaHei', sans-serif";
  ctx.fillText("按 R 重新开始", W / 2, 424);
  ctx.fillStyle = "#8a94a6"; ctx.font = "14px 'Microsoft YaHei', sans-serif";
  ctx.fillText("L 排行榜   ·   C 成就墙   ·   Esc 回主菜单", W / 2, 456);
}
function drawPause() {
  ctx.fillStyle = "rgba(10,14,22,0.6)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "bold 50px 'Microsoft YaHei', sans-serif";
  ctx.fillText("已暂停", W / 2, 340);
  ctx.fillStyle = "#9aa4b2"; ctx.font = "20px 'Microsoft YaHei', sans-serif";
  ctx.fillText("按 P / Esc 继续", W / 2, 390);
}
function drawWaveBanner() {
  const a = Math.min(1, waveBanner);
  ctx.globalAlpha = a; ctx.textAlign = "center";
  ctx.fillStyle = "rgba(0,0,0,0.4)"; roundRect(W / 2 - 220, 120, 440, 80, 12); ctx.fill();
  ctx.fillStyle = "#7ee787"; ctx.font = "bold 40px 'Microsoft YaHei', sans-serif";
  ctx.fillText("第 " + wave + " 波" + (wave === currentMap.waves ? " · 僵尸王" : ""), W / 2, 175);
  ctx.globalAlpha = 1;
}
function drawMapBanner() {
  const a = Math.min(1, mapBanner / 0.6);
  ctx.globalAlpha = a; ctx.textAlign = "center";
  ctx.fillStyle = "rgba(0,0,0,0.5)"; roundRect(W / 2 - 260, 240, 520, 90, 14); ctx.fill();
  ctx.fillStyle = "#79c0ff"; ctx.font = "bold 46px 'Microsoft YaHei', sans-serif";
  ctx.fillText(currentMap.name, W / 2, 300);
  ctx.globalAlpha = 1;
}

/* ---------------- 工具 ---------------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------------- 主循环 ---------------- */
let lastTime = 0;
function loop(t) {
  const dt = Math.min(0.033, (t - lastTime) / 1000 || 0.016);
  lastTime = t;
  if (state === State.PLAYING) update(dt); else runTime += dt;
  render();
  requestAnimationFrame(loop);
}

/* ---------------- 输入 ---------------- */
function startGame(mode) { playerCount = mode; resetGame(); state = State.PLAYING; ensureAudio(); }
function toggleMute() {
  muted = !muted; lsSet("zs_muted", muted ? "1" : "0");
  if (!muted) { ensureAudio(); sfx.pickup(); }
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
function menuSelect(delta) { menuSel = (menuSel + delta + menuButtons.length) % menuButtons.length; }
function activateMenu() {
  const b = menuButtons[menuSel];
  if (!b) return;
  if (b.go === "lb") return openLeaderboard();
  if (b.go === "ach") return openAchievements();
  if (b.go === "stats") {
    if (window.open) window.open("/stats", "_blank"); else location.href = "/stats";
    return;
  }
  startGame(b.mode);
}
function onKeyDown(e) {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  const first = !keys[e.code];
  keys[e.code] = true;
  if (!first) return;                            // 忽略系统按键重复

  if (e.code === "KeyM") return toggleMute();
  if (e.code === "KeyF") return toggleFullscreen();

  if (e.code === "KeyP" || e.code === "Escape") {
    if (state === State.PLAYING) state = State.PAUSED;
    else if (state === State.PAUSED) state = State.PLAYING;
    else if (state === State.LB || state === State.ACH) closeOverlay();
    else if (state === State.OVER) backToMenu();
    return;
  }
  if (e.code === "KeyR" && state === State.OVER) return startGame(playerCount);
  if (e.code === "KeyL" && (state === State.MENU || state === State.OVER)) return openLeaderboard();
  if (e.code === "KeyC" && (state === State.MENU || state === State.OVER)) return openAchievements();
  if (e.code === "KeyT" && (state === State.MENU || state === State.OVER)) {
    if (window.open) window.open("/stats", "_blank"); else location.href = "/stats";
    return;
  }

  if (state === State.LB) {
    if (["ArrowLeft", "KeyA", "ArrowRight", "KeyD"].includes(e.code)) {
      const order = ["score", "kills", "wave"];
      const d = (e.code === "ArrowLeft" || e.code === "KeyA") ? -1 : 1;
      lbSort = order[(order.indexOf(lbSort) + d + order.length) % order.length];
      openLeaderboard();
    }
    return;
  }
  if (state === State.ACH) return;

  if (state === State.MENU) {
    if (e.code === "ArrowUp" || e.code === "KeyW") return menuSelect(-1);
    if (e.code === "ArrowDown" || e.code === "KeyS") return menuSelect(1);
    if (e.code === "Enter" || e.code === "Space") return activateMenu();
    if (e.code === "KeyN") {
      const n = window.prompt("输入你的幸存者代号（最多 16 字）", playerName);
      if (n !== null) { setPlayerName(n); loadProfile(); }
      return;
    }
    if (e.code === "Digit2" || e.code === "Numpad2") return startGame(2);
    if (e.code === "Digit1" || e.code === "Numpad1") return startGame(1);
  }
}
function onKeyUp(e) { keys[e.code] = false; }
function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / rect.width * W, y: (e.clientY - rect.top) / rect.height * H };
}
function onClick(e) {
  ensureAudio();
  if (state === State.OVER) { startGame(playerCount); return; }
  if (state !== State.MENU) return;
  const pt = canvasPoint(e);
  for (let i = 0; i < menuButtons.length; i++) {
    const y = btnY(i);
    if (pt.x >= BTN_X && pt.x <= BTN_X + BTN_W && pt.y >= y && pt.y <= y + BTN_H) {
      menuSel = i; activateMenu(); return;
    }
  }
}
function onBlur() {
  for (const k in keys) keys[k] = false;
  if (state === State.PLAYING) state = State.PAUSED;   // 失焦自动暂停
}
window.addEventListener("keydown", onKeyDown);
window.addEventListener("keyup", onKeyUp);
canvas.addEventListener("click", onClick);
window.addEventListener("blur", onBlur);
document.addEventListener("visibilitychange", () => { if (document.hidden) onBlur(); });
canvas.addEventListener("contextmenu", e => e.preventDefault());

/* ---------------- 启动 ---------------- */
resetGame();
state = State.MENU;
loadProfile();
requestAnimationFrame(loop);
</script>
</body>
