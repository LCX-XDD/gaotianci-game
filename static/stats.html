<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丧尸围城 · 全球统计</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Ccircle cx='16' cy='14' r='8' fill='%237cb96b'/%3E%3Ccircle cx='13' cy='12' r='2' fill='%23ff2a2a'/%3E%3Ccircle cx='19' cy='12' r='2' fill='%23ff2a2a'/%3E%3Crect x='11' y='23' width='10' height='5' rx='2' fill='%237cb96b'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --plane:        #0a0d13;
    --surface-1:    #151a24;
    --text-primary: #ffffff;
    --text-secondary:#c3c2b7;
    --muted:        #8b93a1;
    --grid:         #222937;
    --axis:         #333b4a;
    --series-1:     #3987e5;
    --border:       rgba(255,255,255,0.10);
    --brand:        #7ee787;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--plane); color: var(--text-primary); min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 28px 24px 64px; }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; color: var(--brand); }
  .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  a.btn { color: var(--text-secondary); text-decoration: none; font-size: 13px;
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 13px; }
  a.btn:hover { color: #fff; border-color: rgba(255,255,255,.28); }

  /* 过滤/视图控制行 —— 统一作用于下方全部图表 */
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 18px 0 20px; padding: 11px 14px; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 10px; }
  .controls .lbl { color: var(--muted); font-size: 13px; }
  .seg { display: flex; gap: 2px; background: rgba(255,255,255,.05); border-radius: 7px; padding: 2px; }
  .seg button { background: none; border: 0; color: var(--text-secondary); font: inherit;
    font-size: 13px; padding: 5px 12px; border-radius: 5px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
  .seg button:hover[aria-pressed="false"] { background: rgba(255,255,255,.07); }

  /* KPI 行 */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
    gap: 12px; margin-bottom: 12px; }
  .kpi { background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; }
  .kpi .k { color: var(--muted); font-size: 12px; margin-bottom: 8px; letter-spacing: .3px; }
  .kpi .v { font-size: 30px; font-weight: 650; line-height: 1.05; }
  .kpi .u { font-size: 14px; color: var(--text-secondary); font-weight: 400; margin-left: 3px; }
  .kpi .n { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* 图表卡片 */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .card { background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .card .cap { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bar-mark { transition: opacity .12s; }
  .bar-mark:hover { opacity: .78; }

  /* 表格视图（每个图表的无障碍孪生体） */
  table { width: 100%; border-collapse: collapse; font-size: 13px;
    font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-weight: 500; font-size: 12px;
    border-bottom-color: var(--axis); }
  tbody tr:last-child td { border-bottom: 0; }
  td.id { color: var(--text-primary); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--series-1); margin-right: 8px; vertical-align: middle; }

  .empty { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
  .err { color: #e66767; font-size: 13px; margin-bottom: 14px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 26px; text-align: center; }
  .tier { font-size: 11px; padding: 1px 7px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>丧尸围城 · 全球统计</h1>
    <span class="sub" id="stamp">读取中…</span>
    <span class="spacer"></span>
    <a class="btn" href="/">← 返回游戏</a>
  </header>

  <div class="controls">
    <span class="lbl">视图</span>
    <div class="seg" role="group" aria-label="视图切换">
      <button id="v-chart" aria-pressed="true">图表</button>
      <button id="v-table" aria-pressed="false">表格</button>
    </div>
    <span class="lbl">｜ 数据来自本机 SQLite · 每局结束自动写入</span>
  </div>

  <div id="err" class="err" hidden></div>
  <div id="kpis" class="kpis"></div>
  <div id="c-daily" class="card"></div>
  <div class="grid2">
    <div id="c-weapons" class="card"></div>
    <div id="c-zombies" class="card"></div>
  </div>
  <div id="c-ach" class="card"></div>
  <div id="c-players" class="card"></div>

  <footer>丧尸围城 · 后端 server.py (Python 标准库 http.server + sqlite3)</footer>
</div>

<script>
"use strict";
const WEAPON_NAME = { pistol: "手枪", smg: "冲锋枪", shotgun: "霰弹枪", rifle: "步枪", launcher: "火箭筒", laser: "激光枪" };
const ZOMBIE_NAME = { walker: "普通僵尸", runner: "狂奔者", jumper: "跳跃者", spitter: "吐酸者", fat: "胖子",
                      boomer: "自爆者", shield: "盾牌僵尸", brute: "巨型僵尸", boss: "僵尸王" };
const TIER_NAME = { bronze: "青铜", silver: "白银", gold: "黄金", platinum: "白金" };

let stats = null, tableView = false;
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString("zh-CN");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* 数据端 4px 圆角、贴基线/基轴 */
function barV(x, y, w, h, r) {           // 竖条：圆顶端
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}
function barH(x, y, w, h, r) {           // 横条：圆右端
  r = Math.max(0, Math.min(r, h / 2, w));
  return `M${x},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} L${x},${y + h} Z`;
}
function niceTicks(max, count) {
  if (max <= 0) return [0, 1];
  const raw = max / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  const out = []; for (let v = 0; v <= max + step * 0.001; v += step) out.push(Math.round(v * 1000) / 1000);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}
const gridLine = (x1, y1, x2, y2) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--grid)" stroke-width="1" shape-rendering="crispEdges"/>`;

/* ---------------- 各图表 ---------------- */

function cardHead(title, cap) { return `<h2>${esc(title)}</h2><div class="cap">${cap}</div>`; }
function emptyBox(msg) { return `<div class="empty">${esc(msg)}</div>`; }

/* KPI 行：单值即主角，不用图表 */
function renderKpis() {
  const t = stats.totals;
  const items = [
    { k: "总对局数", v: fmt(t.runs), u: "局" },
    { k: "总击杀", v: fmt(t.kills), u: "只", n: t.runs ? "平均 " + (t.kills / t.runs).toFixed(1) + " 只/局" : "" },
    { k: "总游玩时长", v: t.hours.toFixed(1), u: "小时" },
    { k: "幸存者", v: fmt(t.players), u: "人" },
    { k: "历史最高分", v: fmt(t.best_score) },
    { k: "僵尸王击杀", v: fmt(t.boss_kills), u: "只", n: "手雷击杀 " + fmt(t.grenade_kills) },
  ];
  $("kpis").innerHTML = items.map(i =>
    `<div class="kpi"><div class="k">${esc(i.k)}</div>
       <div class="v">${esc(i.v)}<span class="u">${esc(i.u || "")}</span></div>
       ${i.n ? `<div class="n">${esc(i.n)}</div>` : ""}</div>`).join("");
}

/* 每日趋势：时间有序 → 单色竖条，只给峰值直接标注 */
function renderDaily() {
  const rows = stats.daily;
  const el = $("c-daily");
  if (!rows.length) { el.innerHTML = cardHead("每日游玩趋势", "最近 14 天") + emptyBox("还没有对局记录"); return; }
  const W = 1080, H = 210, L = 46, R = 14, T = 16, B = 34;
  const pw = W - L - R, ph = H - T - B;
  const max = Math.max(...rows.map(r => r.runs), 1), ticks = niceTicks(max, 4), top = ticks[ticks.length - 1];
  const slot = pw / rows.length, bw = Math.max(6, slot - 2);   // 2px 表面间隙
  const peak = rows.reduce((a, r) => (r.runs > a.runs ? r : a), rows[0]);

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每日对局数趋势">`;
  for (const t of ticks) {
    const y = T + ph - (t / top) * ph;
    svg += gridLine(L, y, W - R, y);
    svg += `<text x="${L - 8}" y="${y + 4}" fill="var(--muted)" font-size="11" text-anchor="end">${fmt(t)}</text>`;
  }
  rows.forEach((r, i) => {
    const h = (r.runs / top) * ph, x = L + i * slot + (slot - bw) / 2, y = T + ph - h;
    svg += `<path class="bar-mark" d="${barV(x, y, bw, h, 4)}" fill="var(--series-1)"><title>${esc(r.day)}　${fmt(r.runs)} 局 · ${fmt(r.kills)} 击杀 · 最高分 ${fmt(r.best_score)}</title></path>`;
    if (r.day === peak.day) svg += `<text x="${x + bw / 2}" y="${y - 5}" fill="var(--text-secondary)" font-size="11" text-anchor="middle">${fmt(r.runs)}</text>`;
    if (rows.length <= 16 || i % 2 === 0) {
      svg += `<text x="${x + bw / 2}" y="${H - 12}" fill="var(--muted)" font-size="10" text-anchor="middle">${esc(r.day.slice(5))}</text>`;
    }
  });
  svg += `<line x1="${L}" y1="${T + ph}" x2="${W - R}" y2="${T + ph}" stroke="var(--axis)" stroke-width="1" shape-rendering="crispEdges"/></svg>`;

  const tbl = `<table><thead><tr><th>日期</th><th>对局</th><th>击杀</th><th>最高分</th></tr></thead><tbody>` +
    rows.slice().reverse().map(r => `<tr><td class="id">${esc(r.day)}</td><td>${fmt(r.runs)}</td><td>${fmt(r.kills)}</td><td>${fmt(r.best_score)}</td></tr>`).join("") +
    `</tbody></table>`;
  el.innerHTML = cardHead("每日游玩趋势", "最近 14 天 · 柱高为该日对局数") + (tableView ? tbl : svg);
}

/* 横向条形图：名义类别 → 全部同一颜色，长度即量级 */
function hBarChart(title, cap, rows, unit) {
  const W = 520, rowH = 30, L = 96, R = 60, T = 6, gap = 2;
  const H = T + rows.length * rowH + 6;
  const pw = W - L - R;
  const max = Math.max(...rows.map(r => r.value), 1);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
  rows.forEach((r, i) => {
    const y = T + i * rowH, bh = rowH - gap - 6;             // 条间 2px 表面间隙
    const w = Math.max(2, (r.value / max) * pw);
    svg += `<text x="${L - 10}" y="${y + bh / 2 + 4}" fill="var(--text-secondary)" font-size="12" text-anchor="end">${esc(r.label)}</text>`;
    svg += `<rect x="${L}" y="${y + 3}" width="${pw}" height="${bh}" fill="var(--grid)" rx="2"/>`;
    svg += `<path class="bar-mark" d="${barH(L, y + 3, w, bh, 4)}" fill="var(--series-1)"><title>${esc(r.label)}　${fmt(r.value)} ${esc(unit)}${r.note ? " · " + esc(r.note) : ""}</title></path>`;
    svg += `<text x="${L + pw + 8}" y="${y + bh / 2 + 4}" fill="var(--text-primary)" font-size="12">${fmt(r.value)}</text>`;
  });
  svg += `</svg>`;
  const tbl = `<table><thead><tr><th>${esc(cap.col)}</th><th>${esc(unit)}</th><th>占比</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td class="id"><span class="dot"></span>${esc(r.label)}</td><td>${fmt(r.value)}</td><td>${r.share}%</td></tr>`).join("") +
    `</tbody></table>`;
  return cardHead(title, cap.text) + (tableView ? tbl : svg);
}

function renderWeapons() {
  const rows = stats.weapons.filter(w => WEAPON_NAME[w.weapon_id]);
  const el = $("c-weapons");
  if (!rows.length) { el.innerHTML = cardHead("武器击杀排行", "按枪械统计") + emptyBox("暂无数据"); return; }
  const total = rows.reduce((s, w) => s + w.kills, 0) || 1;
  el.innerHTML = hBarChart("武器击杀排行", { text: "各枪械累计击杀 · 后附平均等级", col: "枪械" },
    rows.map(w => ({ label: WEAPON_NAME[w.weapon_id], value: w.kills,
      share: (w.kills / total * 100).toFixed(1),
      note: `Lv.${w.avg_level} 均值 · 最高 Lv.${w.best_level} · ${fmt(w.runs)} 局携带` })), "击杀");
}

function renderZombies() {
  const rows = stats.zombies.filter(z => ZOMBIE_NAME[z.ztype]);
  const el = $("c-zombies");
  if (!rows.length) { el.innerHTML = cardHead("僵尸类型击杀分布", "按品种统计") + emptyBox("暂无数据"); return; }
  const total = rows.reduce((s, z) => s + z.kills, 0) || 1;
  el.innerHTML = hBarChart("僵尸类型击杀分布", { text: "各品种累计被击杀数", col: "品种" },
    rows.map(z => ({ label: ZOMBIE_NAME[z.ztype], value: z.kills,
      share: (z.kills / total * 100).toFixed(1) })), "击杀");
}

/* 解锁率：比例量级 → 单色细条 + 百分比直标 */
function renderAchievements() {
  const rows = stats.achievements;
  const el = $("c-ach");
  const players = stats.totals.players || 1;
  if (!rows.length) { el.innerHTML = cardHead("成就解锁率", "") + emptyBox("暂无数据"); return; }
  const W = 1080, rowH = 34, L = 232, R = 74, T = 4;
  const H = T + rows.length * rowH + 4, pw = W - L - R;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="成就解锁率">`;
  rows.forEach((a, i) => {
    const y = T + i * rowH, bh = 12;
    const pct = Math.min(100, a.unlocked_by / players * 100);
    const w = Math.max(2, pct / 100 * pw);
    svg += `<text x="${L - 12}" y="${y + bh / 2 + 4}" fill="var(--text-secondary)" font-size="12" text-anchor="end">${esc(a.name)}</text>`;
    svg += `<rect x="${L}" y="${y + 1}" width="${pw}" height="${bh}" fill="var(--grid)" rx="3"/>`;
    svg += `<path class="bar-mark" d="${barH(L, y + 1, w, bh, 4)}" fill="var(--series-1)"><title>${esc(a.name)}　${esc(a.desc)}　${a.unlocked_by}/${players} 人解锁</title></path>`;
    svg += `<text x="${L + pw + 10}" y="${y + bh / 2 + 4}" fill="var(--text-primary)" font-size="12">${pct.toFixed(0)}%</text>`;
  });
  svg += `</svg>`;
  const tbl = `<table><thead><tr><th>成就</th><th>难度</th><th>说明</th><th>解锁人数</th><th>解锁率</th></tr></thead><tbody>` +
    rows.map(a => `<tr><td class="id">${esc(a.icon)} ${esc(a.name)}</td>
      <td><span class="tier">${esc(TIER_NAME[a.tier] || a.tier)}</span></td>
      <td style="text-align:left;color:var(--text-secondary)">${esc(a.desc)}</td>
      <td>${fmt(a.unlocked_by)} / ${fmt(players)}</td>
      <td>${(a.unlocked_by / players * 100).toFixed(0)}%</td></tr>`).join("") + `</tbody></table>`;
  el.innerHTML = cardHead("成就解锁率", `共 ${rows.length} 项 · 分母为已建档幸存者数`) + (tableView ? tbl : svg);
}

function renderPlayers() {
  const rows = stats.top_players;
  const el = $("c-players");
  if (!rows.length) { el.innerHTML = cardHead("顶尖幸存者", "") + emptyBox("暂无数据"); return; }
  el.innerHTML = cardHead("顶尖幸存者", "按历史最高分排序") +
    `<table><thead><tr><th>#</th><th>代号</th><th>最高分</th><th>最佳击杀</th><th>最远波数</th><th>累计击杀</th><th>对局</th></tr></thead><tbody>` +
    rows.map((p, i) => `<tr><td class="id">${i + 1}</td><td class="id">${esc(p.name)}</td>
      <td>${fmt(p.best_score)}</td><td>${fmt(p.best_kills)}</td><td>${fmt(p.best_wave)}</td>
      <td>${fmt(p.total_kills)}</td><td>${fmt(p.total_runs)}</td></tr>`).join("") + `</tbody></table>`;
}

function renderAll() {
  renderKpis(); renderDaily(); renderWeapons(); renderZombies(); renderAchievements(); renderPlayers();
}

function load() {
  $("stamp").textContent = "读取中…";
  fetch("/api/stats").then(r => r.json()).then(d => {
    stats = d;
    $("err").hidden = true;
    $("stamp").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN") +
      "　·　" + fmt(d.totals.runs) + " 局 / " + fmt(d.totals.kills) + " 击杀";
    renderAll();
  }).catch(e => {
    $("err").hidden = false;
    $("err").textContent = "无法读取统计数据：" + e.message + "（请确认 server.py 正在运行）";
    $("stamp").textContent = "读取失败";
  });
}

$("v-chart").addEventListener("click", () => {
  tableView = false; $("v-chart").setAttribute("aria-pressed", "true");
  $("v-table").setAttribute("aria-pressed", "false"); if (stats) renderAll();
});
$("v-table").addEventListener("click", () => {
  tableView = true; $("v-table").setAttribute("aria-pressed", "true");
  $("v-chart").setAttribute("aria-pressed", "false"); if (stats) renderAll();
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
